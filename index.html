<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de PCs - Encuentra tu equipo ideal</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --border-color: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 15px; margin: 0; }
    
    .header { text-align: center; margin-bottom: 20px; }
    h1 { color: var(--accent); font-size: 1.5rem; margin-bottom: 5px; }
    .subtitle { color: var(--text-muted); font-size: 0.85rem; }

    /* 3 RECUPADROS DE CATEGORÍAS PRINCIPALES */
    .categorias-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .cat-card {
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-card:hover, .cat-card.activo {
      border-color: var(--accent);
      background: #1e3a8a;
    }

    .cat-card .icon { font-size: 1.8rem; margin-bottom: 5px; }
    .cat-card span { font-size: 0.8rem; font-weight: bold; display: block; }

    /* BOTÓN PARA ABRIR FILTROS AVANZADOS */
    .btn-toggle-filtros {
      width: 100%;
      background: var(--bg-secondary);
      color: var(--accent);
      border: 1px dashed var(--border-color);
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      text-align: center;
    }

    /* PANEL DE FILTROS OCULTO POR DEFECTO */
    .panel-filtros {
      background: var(--bg-secondary);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      display: none; /* Oculto inicialmente */
    }

    .panel-filtros.mostrar { display: block; }
    .campo { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.8rem; color: var(--text-muted); }
    select, input[type="range"] { width: 100%; padding: 10px; background: #0b0f19; color: #fff; border: 1px solid var(--border-color); border-radius: 8px; }

    /* TARJETAS DE LAS PCS (CON FOTO Y INFO) */
    .grid-pcs { display: grid; gap: 16px; }
    
    .card-pc {
      background: var(--bg-secondary);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .pc-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #334155; /* Fondo por si carga lento la imagen */
    }

    .pc-content { padding: 16px; }
    .card-pc h3 { margin: 0 0 8px 0; font-size: 1.1rem; color: #fff; }
    .precio-tag { font-size: 1.2rem; font-weight: bold; color: #4ade80; margin-bottom: 10px; }
    .specs { font-size: 0.85rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 15px; }

    .btn-wa {
      display: block;
      width: 100%;
      background-color: #25D366;
      color: white;
      text-align: center;
      padding: 12px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .no-res { text-align: center; color: var(--text-muted); padding: 30px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>¿Qué tipo de PC buscas?</h1>
    <div class="subtitle">Selecciona una categoría o despliega los filtros</div>
  </div>

  <!-- 1. LOS 3 RECUADROS DE CATEGORÍAS -->
  <div class="categorias-grid">
    <div class="cat-card" onclick="seleccionarCategoria('oficina', this)">
      <div class="icon">💼</div>
      <span>Oficina</span>
    </div>
    <div class="cat-card" onclick="seleccionarCategoria('gaming', this)">
      <div class="icon">🎮</div>
      <span>Gaming</span>
    </div>
    <div class="cat-card" onclick="seleccionarCategoria('streamer', this)">
      <div class="icon">🚀</div>
      <span>Streamer</span>
    </div>
  </div>

  <!-- BOTÓN PARA FILTROS AVANZADOS -->
  <button class="btn-toggle-filtros" onclick="alternarFiltros()">⚙️ Ajustar Precios y Filtros Avanzados</button>

  <!-- PANEL DE FILTROS AVANZADOS (OCULTO) -->
  <div class="panel-filtros" id="panelFiltros">
    <div class="campo">
      <label>Precio Máximo: $<span id="precioVal">3,000</span> USD</label>
      <input type="range" id="precio" min="400" max="3000" step="100" value="3000" oninput="filtrar()">
    </div>
    <div class="campo">
      <label>Tarjeta Gráfica:</label>
      <select id="gpu" onchange="filtrar()">
        <option value="todas">Todas</option>
        <option value="NVIDIA">NVIDIA</option>
        <option value="AMD">AMD</option>
        <option value="Integrada">Gráficos Integrados</option>
      </select>
    </div>
  </div>

  <!-- RESULTADOS -->
  <div class="grid-pcs" id="contenedorPcs"></div>

  <script>
    // Variable global para guardar la categoría seleccionada ('todos', 'oficina', 'gaming', 'streamer')
    let categoriaActual = 'todos';

    // Base de datos con fotos reales de ejemplo y categoría asignada
    const computadoras = [
      { 
        nombre: "PC Oficina Básica", 
        categoria: "oficina",
        precio: 450, 
        ram: 16, 
        gpuMarca: "Integrada", 
        gpuModelo: "Gráficos Vega",
        imagen: "https://images.unsplash.com/photo-1587831994791-bcac16773215?w=500&auto=format&fit=crop&q=60",
        whatsapp: "5215512345678"
      },
      { 
        nombre: "PC Gamer Entrada", 
        categoria: "gaming",
        precio: 850, 
        ram: 16, 
        gpuMarca: "AMD", 
        gpuModelo: "RX 6600",
        imagen: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=500&auto=format&fit=crop&q=60",
        whatsapp: "5215512345678"
      },
      { 
        nombre: "PC Pro Streamer & Edición", 
        categoria: "streamer",
        precio: 1650, 
        ram: 32, 
        gpuMarca: "NVIDIA", 
        gpuModelo: "RTX 4070",
        imagen: "https://images.unsplash.com/photo-1593640408182-31c70c8268f5?w=500&auto=format&fit=crop&q=60",
        whatsapp: "5215512345678"
      }
    ];

    function seleccionarCategoria(cat, elemento) {
      // Quitar clase activo de todos y ponérsela al clickeado
      document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('activo'));
      
      if (categoriaActual === cat) {
        categoriaActual = 'todos'; // Si vuelve a hacer clic, deselecciona
      } else {
        categoriaActual = cat;
        elemento.classList.add('activo');
      }
      filtrar();
    }

    function alternarFiltros() {
      const panel = document.getElementById('panelFiltros');
      panel.classList.toggle('mostrar');
    }

    function filtrar() {
      const maxPrecio = parseInt(document.getElementById('precio').value);
      const gpuSeleccionada = document.getElementById('gpu').value;
      document.getElementById('precioVal').innerText = maxPrecio.toLocaleString();

      const resultados = computadoras.filter(pc => {
        const cumpleCategoria = categoriaActual === 'todos' || pc.categoria === categoriaActual;
        const cumplePrecio = pc.precio <= maxPrecio;
        const cumpleGpu = gpuSeleccionada === 'todas' || pc.gpuMarca === gpuSeleccionada;

        return cumpleCategoria && cumplePrecio && cumpleGpu;
      });

      const contenedor = document.getElementById('contenedorPcs');

      if (resultados.length === 0) {
        contenedor.innerHTML = '<div class="no-res">No hay computadoras con esta combinación. Prueba cambiando la categoría o subiendo el presupuesto.</div>';
        return;
      }

      contenedor.innerHTML = resultados.map(pc => {
        const mensajeWA = encodeURIComponent(`¡Hola! Me interesa la ${pc.nombre} de $${pc.precio} USD. ¿Está disponible?`);
        return `
          <div class="card-pc">
            <img src="${pc.imagen}" alt="${pc.nombre}" class="pc-img">
            <div class="pc-content">
              <h3>${pc.nombre}</h3>
              <div class="precio-tag">$${pc.precio} USD</div>
              <div class="specs">
                ⚡ <b>Gráfica:</b> ${pc.gpuModelo}<br>
                🧠 <b>RAM:</b> ${pc.ram} GB
              </div>
              <a href="https://wa.me/${pc.whatsapp}?text=${mensajeWA}" target="_blank" class="btn-wa">
                💬 Preguntar por WhatsApp
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Ejecutar al iniciar
    filtrar();
  </script>
</body>
</html>
